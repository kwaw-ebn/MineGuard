databases:
  - name: mineguard-db
    databaseName: mineguard
    user: mineguard
    plan: free
    region: frankfurt

services:
  - type: web
    name: mineguard-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mineguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mineguard-frontend-4kiq.onrender.com
      - key: PYTHON_VERSION
        value: 3.13.7

  - type: web
    name: mineguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "Frontend ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
